<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0055A4" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Aventuras por Assaí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=15" />
</head>
<body>
  <div id="game-wrapper" data-hud="normal">
    <canvas id="gameCanvas" width="768" height="432"></canvas>
    <div class="golden-frame" aria-hidden="true">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-group">
        <div id="hud-hearts" class="hud-hearts"></div>
        <div class="hud-item"><span class="hud-label" data-i18n="hud_score"></span><span id="hud-score">000000</span></div>
        <div class="hud-item"><span class="hud-label" data-i18n="hud_sakura"></span><span id="hud-coins">x00</span></div>
      </div>
      <div class="hud-group">
        <div class="hud-item"><span class="hud-label" data-i18n="hud_time"></span><span id="hud-time">00:00</span></div>
        <div class="hud-item"><span class="hud-label" data-i18n="hud_stage"></span><span id="hud-world">1-1</span></div>
        <button id="btn-pause" class="hud-btn" aria-label="Pausa">
          <svg class="lucide lucide-pause" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
        </button>
      </div>
    </div>

    <!-- Controles touch -->
    <div id="mobile-controls" class="mobile-controls hidden">
      <div class="mobile-dpad">
        <button id="btn-left" class="touch-btn" aria-label="Esquerda">
          <svg class="lucide lucide-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button id="btn-right" class="touch-btn" aria-label="Direita">
          <svg class="lucide lucide-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="mobile-actions">
        <button id="btn-down" class="touch-btn" aria-label="Descer">
          <svg class="lucide lucide-arrow-big-down" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6v6h4l-7 7-7-7h4V6h6z"/></svg>
        </button>
        <button id="btn-jump" class="touch-btn jump-btn" aria-label="Pular">
          <svg class="lucide lucide-arrow-big-up" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18v-6H5l7-7 7 7h-4v6H9z"/></svg>
        </button>
      </div>
    </div>

    <div id="toast-area" class="toast-area"></div>

    <div id="stage-banner" class="stage-banner hidden">
      <div class="stage-banner-box">
        <div id="stage-banner-sub" class="stage-banner-sub">FASE 1-1</div>
        <div id="stage-banner-title" class="stage-banner-title"></div>
      </div>
    </div>

    <!-- Tela inicial -->
    <div id="menu-screen" class="title-overlay">
      <div class="title-block">
        <div class="title-sparkles">
          <span class="sparkle s-left">✦</span>
          <h1 class="rpg-title">AVENTURAS<br />POR ASSAÍ</h1>
          <span class="sparkle s-right">✦</span>
        </div>
        <div class="rpg-subtitle">◆ SORA &amp; RIKU ◆</div>
      </div>

      <div class="title-hero">
        <button class="medallion-btn selected" id="select-male">
          <div class="medallion-ring"><img src="assets/portrait-sora.png?v=13" alt="Sora" class="medallion-img" /></div>
          <span class="medallion-name">SORA</span>
        </button>
        <button class="medallion-btn" id="select-female">
          <div class="medallion-ring"><img src="assets/portrait-riku.png?v=13" alt="Riku" class="medallion-img" /></div>
          <span class="medallion-name">RIKU</span>
        </button>
      </div>

      <div class="title-footer">
        <button id="btn-start" class="rpg-start-btn">
          <svg class="lucide lucide-flame" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          <span data-i18n="start"></span>
        </button>
        <div class="title-menu-row">
          <button id="btn-open-ranking" class="chip-btn">
            <svg class="lucide lucide-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            <span data-i18n="ranking"></span>
          </button>
          <button id="btn-open-achievements" class="chip-btn">
            <svg class="lucide lucide-medal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><path d="M11 12 5.12 2.2"/><path d="m13 12 5.88-9.8"/><path d="M8 7h8"/><circle cx="12" cy="17" r="5"/><path d="M12 18v-2h-.5"/></svg>
            <span data-i18n="achievements"></span>
          </button>
          <button id="btn-open-settings" class="chip-btn">
            <svg class="lucide lucide-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            <span data-i18n="settings"></span>
          </button>
        </div>
        <div class="controls-hint desktop-only" data-i18n="controls_hint"></div>
      </div>
    </div>

    <!-- Diálogo (4ª parede) -->
    <div id="dialogue-box" class="dialogue-overlay hidden">
      <div class="rpg-dialogue-card">
        <div class="dialogue-medallion"><img id="dialogue-avatar-img" src="assets/portrait-sora.png?v=13" alt="" class="medallion-img" /></div>
        <div class="dialogue-content">
          <div id="dialogue-speaker" class="dialogue-speaker">SORA</div>
          <p id="dialogue-text" class="dialogue-text"></p>
          <div class="dialogue-actions">
            <button id="btn-dialogue-ok" class="rpg-start-btn small">
              <span data-i18n="dialogue_ok"></span>
              <svg class="lucide lucide-play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Resultado da fase -->
    <div id="result-screen" class="overlay hidden">
      <div class="panel">
        <h2 id="result-title" class="panel-title"></h2>
        <div id="result-stage" class="panel-sub"></div>
        <div id="result-stars" class="stars">
          <span><svg class="lucide lucide-star" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
          <span><svg class="lucide lucide-star" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
          <span><svg class="lucide lucide-star" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
        </div>
        <div class="star-hint" data-i18n="star_hint"></div>
        <div id="result-stats" class="stats"></div>
        <button id="btn-result-continue" class="rpg-start-btn small">
          <span data-i18n="continue"></span>
          <svg class="lucide lucide-play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        </button>
      </div>
    </div>

    <!-- Fim de jogo -->
    <div id="end-screen" class="overlay hidden">
      <div class="panel">
        <h2 id="end-title" class="panel-title"></h2>
        <p id="end-message" class="panel-text"></p>
        <div class="end-stats">
          <div><span data-i18n="final_score"></span><b id="final-score-val">0</b></div>
          <div><span data-i18n="total_stars"></span><b id="final-stars-val">0</b></div>
        </div>
        <div id="name-row" class="name-row">
          <input id="player-name" maxlength="14" data-i18n-ph="your_name" />
          <button id="btn-save-score" class="chip-btn" data-i18n="save_score"></button>
        </div>
        <p id="host-player" class="panel-text hidden"></p>
        <p id="save-msg" class="save-msg hidden" data-i18n="saved"></p>
        <ol id="end-ranking" class="ranking-list"></ol>
        <div class="panel-buttons">
          <button id="btn-restart" class="rpg-start-btn small" data-i18n="play_again"></button>
          <button id="btn-menu" class="chip-btn" data-i18n="main_menu"></button>
        </div>
      </div>
    </div>

    <!-- Ranking -->
    <div id="ranking-modal" class="overlay hidden">
      <div class="panel">
        <h2 class="panel-title" data-i18n="ranking_title"></h2>
        <ol id="ranking-list" class="ranking-list"></ol>
        <button class="chip-btn close-modal" data-i18n="close"></button>
      </div>
    </div>

    <!-- Conquistas -->
    <div id="achievements-modal" class="overlay hidden">
      <div class="panel">
        <h2 class="panel-title" data-i18n="ach_title"></h2>
        <ul id="achievements-list" class="ach-list"></ul>
        <button class="chip-btn close-modal" data-i18n="close"></button>
      </div>
    </div>

    <!-- Configurações -->
    <div id="settings-modal" class="overlay hidden">
      <div class="panel">
        <h2 class="panel-title" data-i18n="settings_title"></h2>
        <div class="settings-grid">
          <label data-i18n="language"></label>
          <select id="set-lang"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option><option value="ja">日本語</option></select>

          <label data-i18n="music"></label>
          <div class="range-row"><input type="range" id="set-music" min="0" max="100" /><span id="set-music-val"></span></div>

          <label data-i18n="sfx"></label>
          <div class="range-row"><input type="range" id="set-sfx" min="0" max="100" /><span id="set-sfx-val"></span></div>

          <label data-i18n="hud_size"></label>
          <select id="set-hud"><option value="small" data-i18n="small"></option><option value="normal" data-i18n="normal"></option><option value="large" data-i18n="large"></option></select>

          <label data-i18n="touch_controls"></label>
          <select id="set-touch"><option value="auto" data-i18n="auto"></option><option value="always" data-i18n="always"></option><option value="never" data-i18n="never"></option></select>

          <label data-i18n="ctrl_size"></label>
          <select id="set-ctrl-size"><option value="normal" data-i18n="normal"></option><option value="large" data-i18n="large"></option><option value="huge" data-i18n="huge"></option></select>

          <label data-i18n="ctrl_opacity"></label>
          <div class="range-row"><input type="range" id="set-ctrl-opacity" min="20" max="100" /><span id="set-ctrl-opacity-val"></span></div>

          <label data-i18n="left_handed"></label>
          <input type="checkbox" id="set-left" />
        </div>
        <div class="panel-buttons">
          <button id="btn-fullscreen" class="chip-btn" data-i18n="fullscreen"></button>
          <button class="chip-btn close-modal" data-i18n="close"></button>
        </div>
      </div>
    </div>

    <!-- Pausa -->
    <div id="pause-modal" class="overlay hidden">
      <div class="panel">
        <h2 class="panel-title" data-i18n="paused"></h2>
        <div class="panel-buttons vertical">
          <button id="btn-resume" class="rpg-start-btn small" data-i18n="resume"></button>
          <button id="btn-pause-settings" class="chip-btn">
            <svg class="lucide lucide-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            <span data-i18n="settings"></span>
          </button>
          <button id="btn-quit" class="chip-btn" data-i18n="quit"></button>
        </div>
      </div>
    </div>

    <div id="rotate-hint" class="rotate-hint">
      <div class="rotate-icons">
        <svg class="lucide lucide-smartphone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
        <svg class="lucide lucide-rotate-cw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      </div>
      <p data-i18n="rotate"></p>
    </div>
  </div>

  <script src="js/i18n.js?v=17"></script>
  <script src="js/audio.js?v=17"></script>
  <script src="js/sprites.js?v=17"></script>
  <script src="js/game.js?v=17"></script>
</body>
</html>
